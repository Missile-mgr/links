  <style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: #fff;
    background-color: #050507;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 40px 20px 0 20px;
    position: relative;
  }

  /* ==== Animated RGB Glowing Background ==== */
  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(220px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(circle at center, #ff00ff, transparent 70%);
    animation: hueShift 20s linear infinite, pulse 8s ease-in-out infinite alternate;
  }

  .glow.one {
    top: -150px;
    left: -150px;
  }

  .glow.two {
    bottom: -200px;
    right: -150px;
    animation-delay: 4s;
  }

  @keyframes hueShift {
    0% { filter: hue-rotate(0deg) blur(220px); }
    100% { filter: hue-rotate(360deg) blur(220px); }
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.4; }
    100% { transform: scale(1.15); opacity: 0.6; }
  }

  /* ==== Content ==== */
  * {
    position: relative;
    z-index: 1;
    box-sizing: border-box;
  }

  .profile-img {
    width: 220px;
    max-width: 80%;
    height: auto;
    margin-top: 40px;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(255,255,255,0.08);
  }

  h1 {
    font-size: 1.8rem;
    margin-top: 20px;
  }

  p.bio {
    font-size: 1rem;
    color: #ccc;
    margin: 10px 0 30px 0;
    text-align: center;
    max-width: 600px;
  }

  /* ==== Link Buttons ==== */
  .link-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 350px;
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 15px 20px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease-in-out;
    position: relative;
    overflow: hidden;
  }

  .link img {
    height: 22px;
    width: 22px;
    position: absolute;
    left: 15px;
    filter: brightness(0) invert(1);
    opacity: 0.9;
    object-fit: contain;
  }

  .link span {
    margin: 0 auto;
    text-align: center;
    z-index: 2;
  }

  /* ==== Shimmer Effect on Hover ==== */
  .link::before {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: skewX(-25deg);
    transition: 0.5s;
  }

  .link:hover::before {
    left: 125%;
    transition: left 0.8s ease-in-out;
  }

  /* ==== Accent Hover Colors ==== */
  .link.twitch:hover { background: rgba(145, 70, 255, 0.15); border-color: rgba(145, 70, 255, 0.4); }
  .link.youtube:hover { background: rgba(255, 0, 0, 0.15); border-color: rgba(255, 0, 0, 0.4); }
  .link.tiktok:hover { background: rgba(0, 242, 234, 0.15); border-color: rgba(0, 242, 234, 0.3); }
  .link.instagram:hover { background: rgba(255, 64, 129, 0.15); border-color: rgba(255, 64, 129, 0.3); }
  .link.discord:hover { background: rgba(88, 101, 242, 0.15); border-color: rgba(88, 101, 242, 0.4); }
  .link.tip:hover { background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.3); }

  /* ==== Footer ==== */
  footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 0.8rem;
    width: 100%;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 60px;
  }

  /* ==== Mobile Optimization ==== */
  @media (max-width: 768px) {
    .glow {
      filter: blur(120px);
      opacity: 0.3;
      animation: pulse 10s ease-in-out infinite alternate; /* subtle motion only */
      mix-blend-mode: normal; /* reduce GPU load */
    }

    .profile-img { width: 180px; }
    h1 { font-size: 1.5rem; }

    .link {
      backdrop-filter: none;
      background: rgba(255, 255, 255, 0.07);
    }
  }
</style>
